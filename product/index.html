<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | MISAQ Gadget</title><meta name="robots" content="noindex"><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fa;color:#1b2331}header,main,footer{max-width:940px;margin:auto;padding:22px}header{font-weight:800;font-size:23px}main{display:grid;grid-template-columns:1fr 1fr;gap:25px}.panel{background:white;border-radius:14px;padding:22px;box-shadow:0 6px 24px #0001}img{width:100%;max-height:410px;object-fit:contain}input{width:100%;padding:12px;margin:5px 0 14px;box-sizing:border-box;border:1px solid #bbb;border-radius:8px}button,.color-option{cursor:pointer;padding:10px 16px;border:1px solid #ddd;border-radius:8px;background:#fff}.color-option.is-selected{background:#eef3ff;border-color:#345abb}.color-select{display:flex;gap:8px;flex-wrap:wrap}button[type=submit]{background:#153f82;color:white;width:100%;font-weight:700}.price{font-size:27px;font-weight:bold;color:#b3273f}.error{color:#c21e3a}@media(max-width:700px){main{grid-template-columns:1fr}}</style></head><body><header>MISAQ Gadget</header><main id="content"><div class="panel">পণ্যের তথ্য লোড হচ্ছে...</div></main><footer><a href="/privacy-policy.html">Privacy Policy</a> · <a href="/contact.html">Contact</a> · <a href="/returns-refunds.html">Returns & Refunds</a></footer><script>(async()=>{const sku=(new URLSearchParams(location.search).get('sku')||'').toUpperCase().trim();const root=document.getElementById('content');if(!/^[A-Z0-9_-]{2,60}$/.test(sku)){root.textContent='সঠিক Product SKU দিন।';return;}try{const res=await fetch('https://misaq-sales-bot.misaqholdings.workers.dev/api/v1/public/product?sku='+encodeURIComponent(sku));const json=await res.json();if(!res.ok||!json.ok)throw Error('This product is not currently available.');const p=json.product;document.title=p.name+' | MISAQ Gadget';root.innerHTML='<section class="panel"><img id="productImage" alt=""><h1 id="productTitle"></h1><p id="description"></p><p class="price" id="productPrice"></p><p>Cash on delivery. Our team will call to verify your order.</p></section><section class="panel"><h2>অর্ডার করুন</h2><form id="orderForm"><label>নাম<input id="name" name="name" required minlength="2"></label><label>মোবাইল নম্বর<input id="phone" name="phone" inputmode="tel" required></label><label>সম্পূর্ণ ঠিকানা<input id="address" name="address" required minlength="8"></label><div class="field"><p>ডেলিভারি এলাকা</p><div class="color-select"><button class="color-option" type="button" data-charge="70">ঢাকার ভিতরে — ৳70</button><button class="color-option" type="button" data-charge="120">ঢাকার বাইরে — ৳120</button></div><input type="hidden" id="deliveryZone"></div><p>পরিমাণ</p><button type="button" id="qtyMinus">−</button> <input id="quantity" name="quantity" value="1" readonly style="width:50px;text-align:center"> <button type="button" id="qtyPlus">+</button><p id="sumProduct"></p><p id="sumDelivery"></p><p id="sumTotal"></p><p id="stickyPrice" hidden></p><button type="submit">অর্ডার সাবমিট করুন</button><p id="formStatus" aria-live="polite"></p></form></section>';const form=document.getElementById('orderForm');form.dataset.productCode=p.code;form.dataset.product=p.name;form.dataset.price=String(p.price);document.getElementById('productTitle').textContent=p.name;document.getElementById('description').textContent=p.description||'';document.getElementById('productPrice').textContent='৳'+p.price;const img=document.getElementById('productImage');if(p.image_url){img.src=p.image_url;img.alt=p.name;}else img.hidden=true;for(const path of ['/js/meta-tracking.js','/js/order.js']){const script=document.createElement('script');script.src=path;document.body.appendChild(script);await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=reject});}window.dispatchEvent(new Event('load'));}catch(e){root.innerHTML='<div class="panel error">এই পণ্যের অর্ডার এখন গ্রহণ করা যাচ্ছে না। অনুগ্রহ করে সাপোর্টে যোগাযোগ করুন।</div>';console.warn('product_catalog_unavailable');}})();</script></body></html>
