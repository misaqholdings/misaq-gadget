<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MISAQ Staging Product Management</title><style>body{font:15px system-ui;background:#f4f6fa;color:#172033;margin:0}main{max-width:1050px;margin:32px auto;padding:0 18px}h1{font-size:25px}section{background:white;border:1px solid #dde3ee;border-radius:12px;padding:20px;margin:16px 0}input,select,button{font:inherit;padding:10px;border:1px solid #c9d3e2;border-radius:7px}button{background:#263c72;color:white;cursor:pointer}button:disabled{opacity:.6}label{display:inline-flex;flex-direction:column;gap:5px;margin:6px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #e4e8f0;text-align:left;padding:10px}small{color:#667085}#message{white-space:pre-wrap;color:#36507a}a{color:#263c72}</style><main><h1>MISAQ Product Management <small>Staging only</small></h1><p><a href="/dashboard">← Sales Dashboard</a></p><section id="login"><h2>Admin Sign In</h2><label>Username<input id="username" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="signIn">Sign in</button></section><div id="app" hidden><section><h2>Products</h2><button id="refresh">Refresh</button><table><thead><tr><th>Code</th><th>Name</th><th>Price</th><th>Status</th><th>Variants</th><th>Actions</th></tr></thead><tbody id="products"></tbody></table></section><section><h2>Create Product</h2><form id="createProduct"><label>Code<input name="product_code" required pattern="[A-Za-z0-9_-]{3,64}"></label><label>Name<input name="product_name" required minlength="3"></label><label>Sale Price (BDT)<input name="sale_price" type="number" min="0" step="0.01" required></label><label>Status<select name="status"><option value="inactive">Inactive</option><option value="active">Active</option></select></label><button>Create</button></form></section><section><h2>Variants</h2><label>Product<select id="productChoice"></select></label><button id="loadVariants">Load variants</button><table><thead><tr><th>SKU</th><th>Variant</th><th>Price override</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody id="variants"></tbody></table><h3>Create Variant</h3><form id="createVariant"><label>SKU<input name="sku" required></label><label>Name<input name="variant_name" required minlength="3"></label><label>Price override<input name="price_override" type="number" min="0" step="0.01" placeholder="Optional"></label><label>Initial stock<input name="stock_quantity" type="number" min="0" step="1" value="0"></label><label>Status<select name="status"><option value="inactive">Inactive</option><option value="active">Active</option></select></label><button>Create Variant</button></form></section></div><p id="message" role="status"></p></main><script>
let token='';const $=id=>document.getElementById(id);const msg=t=>$('message').textContent=t;
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{authorization:'Bearer '+token,...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v;}
const el=(tag,text)=>{const e=document.createElement(tag);e.textContent=String(text??'');return e;};
function cell(tr,text){const td=el('td',text);tr.append(td);return td;}
let products=[];
async function load(){const data=await api('/api/v1/catalog/products');products=data.products;$('products').replaceChildren();$('productChoice').replaceChildren();for(const p of products){const o=el('option',p.product_code);o.value=p.product_code;$('productChoice').append(o);const tr=document.createElement('tr');cell(tr,p.product_code);cell(tr,p.product_name);cell(tr,p.sale_price+' '+p.currency);cell(tr,p.status);cell(tr,p.variant_count);const td=cell(tr,'');const btn=el('button',p.status==='active'?'Deactivate':'Activate');btn.onclick=async()=>{if(!confirm('Change '+p.product_code+' status?'))return;try{await api('/api/v1/catalog/products/'+p.product_code,'PATCH',{status:p.status==='active'?'inactive':'active'});await load()}catch(e){msg(e.message)}};td.append(btn);$('products').append(tr)}msg('Catalog loaded: '+products.length+' products');}
async function variants(){const code=$('productChoice').value;if(!code)return;const d=await api('/api/v1/catalog/products/'+code+'/variants');$('variants').replaceChildren();for(const v of d.variants){const tr=document.createElement('tr');cell(tr,v.sku);cell(tr,v.variant_name);cell(tr,v.price_override??'default');cell(tr,v.stock_quantity);cell(tr,v.status);const td=cell(tr,'');const toggle=el('button',v.status==='active'?'Deactivate':'Activate');toggle.onclick=async()=>{try{await api('/api/v1/catalog/variants/'+v.id,'PATCH',{status:v.status==='active'?'inactive':'active'});await variants()}catch(e){msg(e.message)}};td.append(toggle);const stock=el('button','Adjust stock');stock.onclick=async()=>{const delta=Number(prompt('Stock adjustment (+/- integer):'));if(!Number.isSafeInteger(delta)||delta===0)return;const reason=prompt('Reason (minimum 5 characters):');if(!reason)return;try{await api('/api/v1/catalog/variants/'+v.id+'/stock','POST',{quantity_delta:delta,reason});await variants()}catch(e){msg(e.message)}};td.append(stock);$('variants').append(tr)}}
$('signIn').onclick=async()=>{try{const d=await fetch('/api/v1/staff/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})}).then(async r=>{const v=await r.json();if(!r.ok)throw Error(v.error);return v});token=d.session_token;await load();$('login').hidden=true;$('app').hidden=false;$('password').value=''}catch(e){msg(e.message)}};
$('refresh').onclick=()=>load().catch(e=>msg(e.message));$('loadVariants').onclick=()=>variants().catch(e=>msg(e.message));
$('createProduct').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/api/v1/catalog/products','POST',{product_code:f.get('product_code'),product_name:f.get('product_name'),sale_price:Number(f.get('sale_price')),status:f.get('status')});e.target.reset();await load()}catch(err){msg(err.message)}};
$('createVariant').onsubmit=async e=>{e.preventDefault();const code=$('productChoice').value;if(!code)return msg('Select product');const f=new FormData(e.target);try{await api('/api/v1/catalog/products/'+code+'/variants','POST',{sku:f.get('sku'),variant_name:f.get('variant_name'),price_override:f.get('price_override')===''?null:Number(f.get('price_override')),stock_quantity:Number(f.get('stock_quantity')),status:f.get('status')});e.target.reset();await variants();await load()}catch(err){msg(err.message)}};
</script></html>
